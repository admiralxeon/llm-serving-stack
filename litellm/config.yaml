# LiteLLM gateway config. Apps only ever ask for "chat" or "embed";
# which backend serves them is decided here, not in app code.

# Versions registered in the LLM platform's model registry are generated into this file and
# appended to model_list. Hand-written deployments stay below.
include:
  - models.generated.yaml

model_list:
  # Primary chat: vLLM on the GPU. Reached over Docker's internal network by service name.
  - model_name: chat
    litellm_params:
      model: hosted_vllm/qwen2.5-1.5b
      api_base: http://vllm:8000/v1
      api_key: os.environ/VLLM_API_KEY
      # Give up on vLLM after this long (seconds) and let the fallback take over.
      timeout: 60
      stream_timeout: 30
      order: 1

  # Same "chat" group, lower priority. Health-check routing can only skip a deployment if
  # another one remains in its group, so this is what lets a dead vLLM be bypassed at once.
  - model_name: chat
    litellm_params:
      model: ollama_chat/qwen2.5:1.5b
      api_base: http://ollama:11434
      timeout: 180
      order: 2

  # Backup chat: same model family on Ollama, CPU only. Slower, but keeps "chat" alive.
  # Still needed for requests that hit vLLM before a health check has noticed it's down.
  - model_name: chat-fallback
    litellm_params:
      model: ollama_chat/qwen2.5:1.5b
      api_base: http://ollama:11434
      timeout: 180

  # Embeddings for RAG: nomic-embed-text (768 dimensions) on Ollama.
  - model_name: embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama:11434
      timeout: 30
    model_info:
      mode: embedding

  # LLM platform RAG: bge-small-en-v1.5 (384 dimensions) on TEI, through TEI's
  # OpenAI-compatible /v1/embeddings.
  - model_name: embed-small
    litellm_params:
      model: openai/BAAI/bge-small-en-v1.5
      api_base: http://tei-embed:80/v1
      # TEI has no auth of its own; it's only reachable on the Docker network.
      api_key: "none"
      timeout: 30
    model_info:
      mode: embedding

  # LLM platform RAG: bge-reranker-base on TEI. The huggingface provider calls TEI's /rerank.
  - model_name: rerank
    litellm_params:
      model: huggingface/BAAI/bge-reranker-base
      api_base: http://tei-rerank:80
      timeout: 30
    model_info:
      mode: rerank

router_settings:
  # If "chat" fails (down, timeout, 5xx), retry the request on "chat-fallback".
  fallbacks:
    - chat: ["chat-fallback"]
  # Don't retry vLLM first: go straight to the fallback.
  num_retries: 0
  # After 1 failure in a minute, skip the deployment for 30 s instead of hammering it.
  allowed_fails: 1
  cooldown_time: 30

litellm_settings:
  # Spans go to Tempo (see OTEL_* in docker-compose.yml).
  callbacks: ["otel"]
  # Keep prompts and answers out of traces and logs: they can hold anything users typed.
  turn_off_message_logging: true
  # Hard ceiling on any request, including fallbacks.
  request_timeout: 240
  drop_params: true

general_settings:
  # Admin key: creates/revokes per-app virtual keys. Never given to apps.
  master_key: os.environ/LITELLM_MASTER_KEY
  # Keys, budgets and spend logs live in Postgres.
  database_url: os.environ/DATABASE_URL
  # Probe every backend in the background so /health shows which are up.
  background_health_checks: true
  health_check_interval: 30
  # Skip deployments the latest health check found unhealthy, instead of waiting for a
  # live request to fail first.
  enable_health_check_routing: true
