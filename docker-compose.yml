services:
  vllm:
    # Pinned tag, never :latest. Rollback = change this line back and `docker compose up -d`.
    image: vllm/vllm-openai:v0.31.0
    container_name: vllm
    command:
      - ${VLLM_MODEL:-Qwen/Qwen2.5-1.5B-Instruct}
      # Pinned Hugging Face commit, so a re-download can never silently change the weights.
      - --revision=${VLLM_REVISION:-989aa7980e4cf806f80c7fef2b1adb7bc71aa306}
      # The name clients put in "model": "..." (decoupled from the HF repo name).
      - --served-model-name=${VLLM_SERVED_NAME:-qwen2.5-1.5b}
      - --gpu-memory-utilization=${VLLM_GPU_MEM:-0.60}
      # Longest prompt + answer one request may have. A cap, not a reservation: memory is
      # used per token generated, so short requests perform the same at 2k or 8k.
      - --max-model-len=${VLLM_MAX_LEN:-4096}
      # Max sequences batched together per step. Extra requests wait in vLLM's queue.
      - --max-num-seqs=${VLLM_MAX_SEQS:-16}
      - --api-key=${VLLM_API_KEY}
    environment:
      HF_HOME: /root/.cache/huggingface
    volumes:
      # Weights cached on E:, so container restarts don't re-download 3 GB.
      - ./data/hf-cache:/root/.cache/huggingface
    ports:
      # Localhost only: the LAN goes through LiteLLM on :4000. Kept on 127.0.0.1 for
      # direct benchmarks (gateway overhead) and debugging.
      - "127.0.0.1:8000:8000"
    # PyTorch workers share tensors through /dev/shm; Docker's 64 MB default is too small.
    shm_size: 2gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Must cover a cold start: first weight download + loading + CUDA graph capture.
      start_period: 600s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.13
    container_name: ollama
    # No GPU reservation on purpose: vLLM has claimed the VRAM, so Ollama runs on the CPU.
    environment:
      # Keep models loaded for 24 h so a fallback request doesn't pay a cold load.
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ./data/ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot job: pull the Ollama models, then exit. Re-running is cheap (already cached).
  ollama-pull:
    image: ollama/ollama:0.40.13
    container_name: ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull nomic-embed-text && ollama pull qwen2.5:1.5b"]
    restart: "no"

  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    container_name: postgres
    environment:
      POSTGRES_USER: llm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: llm
    volumes:
      # Named volume, not a Windows bind mount: Postgres needs Linux file permissions.
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm -d llm"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  litellm:
    image: litellm/litellm-database:v1.105.7
    container_name: litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      # Encrypts provider credentials stored in the DB. Never change it after first start.
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: postgresql://llm:${POSTGRES_PASSWORD}@postgres:5432/litellm
      VLLM_API_KEY: ${VLLM_API_KEY}
      STORE_MODEL_IN_DB: "False"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    ports:
      # The one port the LAN talks to.
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      # Deliberately NOT depending on vllm: the gateway must start (and fall back) without it.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Reads GPU numbers by running nvidia-smi. DCGM is poorly supported on WSL2;
  # on a real Linux server, use NVIDIA's DCGM exporter instead.
  gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.16.0
    container_name: gpu-exporter
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.9
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Don't download plugins at startup: a private server shouldn't need the internet.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      # Provisioned from files, so the dashboard lives in git and rebuilds itself.
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # FastAPI RAG app. Talks to models only through LiteLLM, with its own key.
  rag:
    build: ./rag
    image: llm-serving-demo/rag:0.1.0
    container_name: rag
    environment:
      DATABASE_URL: postgresql://llm:${POSTGRES_PASSWORD}@postgres:5432/rag
      LITELLM_URL: http://litellm:4000
      LITELLM_KEY: ${RAG_LITELLM_KEY}
      MAX_IN_FLIGHT: ${RAG_MAX_IN_FLIGHT:-16}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
  prometheus-data:
  grafana-data:
