global:
  # How often Prometheus reads every target. Short, because queues build within seconds.
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml
  # The LLM platform's alerts, mounted from its repo (monitoring/prometheus/).
  - /etc/prometheus/platform/*-alerts.yml

# The LLM platform's scrape jobs (API replicas and worker), mounted from its repo.
scrape_config_files:
  - /etc/prometheus/platform/scrape-*.yml
  # Host-specific jobs, such as the DCGM exporter the Ansible playbook adds on Linux.
  - /etc/prometheus/host/scrape-*.yml

scrape_configs:
  # vLLM's own numbers: queue, KV cache, tokens, latency histograms.
  - job_name: vllm
    static_configs:
      - targets: ["vllm:8000"]
  # GPU numbers from nvidia-smi. On a real Linux server this would be DCGM exporter.
  - job_name: gpu
    static_configs:
      - targets: ["gpu-exporter:9835"]
